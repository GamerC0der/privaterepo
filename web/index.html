<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Kiosk OS</title>
<link rel="icon" href="data:,">
</head>
<body>
<input type="file" id="iso" accept=".iso">
<div id="screen_container">
  <div id="canvas_container">
    <canvas></canvas>
  </div>
  <div id="text_container"></div>
</div>
<script src="v86/libv86.js"></script>
<script>
  document.getElementById("iso").addEventListener("change", async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    e.target.remove();
    const emulator = new V86({
      wasm_path: "v86/v86.wasm",
      bios: { url: "v86/seabios.bin" },
      vga_bios: { url: "v86/vgabios.bin" },
      cdrom: { buffer: await file.arrayBuffer() },
      memory_size: 512 * 1024 * 1024,
      vga_memory_size: 16 * 1024 * 1024,
      screen_container: document.getElementById("screen_container"),
      autostart: true,
    });
    // no visible UI: boot output goes to devtools console only (F12)
    let line = "";
    emulator.add_listener("serial0-output-char", (ch) => {
      if (ch === "\n") { console.log("[kiosk]", line); line = ""; }
      else if (ch !== "\r") { line += ch; }
    });
  });
</script>
</body>
</html>
